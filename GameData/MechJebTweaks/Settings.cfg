// MechJebTweaks settings. Changes take effect after restarting KSP.
MECHJEB_TWEAKS
{
	// MechJeb does not raise on-rails time warp while any engine is still burning.
	WARP_GUARD
	{
		Enabled = true

		// Once no engine is commanded to burn and the remaining thrust is below this acceleration
		// (m/s²), the guard sets those engines' throttle to exactly zero. Engine throttle decays
		// exponentially and never reaches zero by itself; some engine mods (e.g. KSP Interstellar
		// Extended) keep any leftover throttle as thrust through the whole warp.
		SnapAcceleration = 0.001

		// Extra seconds to wait after the last engine stopped burning.
		SettleSeconds = 2.0

		// Also hold back physics warp. Off by default: physics warp still simulates thrust,
		// and MechJeb's classic ascent throttles on purpose during physics-warped coasts.
		GuardPhysicsWarp = false

		// Show an on-screen message while warp is being held back.
		ShowMessages = true
	}

	// MechJeb's landing autopilot, low-orbit deorbit ("moving to low deorbit burn point"): MechJeb warps there
	// only while the vessel turns slower than 0.001 rad/s, but holding retrograde the vessel turns with the
	// orbit, and low orbits of small bodies turn faster (JNSQ Mun below ~210 km), so it coasted at 1x.
	// The fix asks for the same warp when the vessel turns at most ExtraRate (rad/s) faster than the orbit
	// and points within AimAngle (degrees) of MechJeb's wanted direction.
	LANDING_WARP
	{
		Enabled = true
		AimAngle = 2
		ExtraRate = 0.002
	}

	// MechJeb takes an engine's available thrust as maxFuelFlow x Isp x g, like the game computes thrust. That is exact
	// when thrust is proportional to the throttle. KSP Interstellar Extended thermal nozzles rewrite maxFuelFlow and Isp every
	// frame from the reactor state, so MechJeb's figure depends on the throttle (Lightbulb: 438 kN at 0%, 308 kN at 5%,
	// 175 kN at 100%) and the landing autopilot braked far too late. For engines on parts with one of Modules, the fix
	// measures the thrust while the engine runs at LearnThrottle or above, and MechJeb then sees exactly that at any throttle
	// (minus KSPIE's own pressure loss in an atmosphere). Before such a run the part's passport thrust is a cap only.
	// Other engines are not touched.
	THRUST_CAP
	{
		Enabled = true
		Modules = ThermalEngineController, ThermalNozzleController
		LearnThrottle = 0.95
	}

	// MechJeb's landing guidance has a landing site drop-down with a "Set" button, shown when the current body
	// has any site (MechJeb knows only launch sites and its own config). With FromWaypoints the game's
	// waypoints are added to it: custom ones (made in SCANsat or on the map) and contract ones.
	LANDING_SITES
	{
		FromWaypoints = true
	}

	// "Rendezvous with offset" window in MechJeb's window list.
	// The offset distance itself is set in the window and saved by MechJeb.
	RENDEZVOUS_OFFSET
	{
		Enabled = true

		// In career/science the window appears once any of these tech nodes is researched (comma separated;
		// empty = always). advUnmanned is where MechJeb opens its own rendezvous planner.
		// Also needs patched conics (Tracking Station level 2), like MechJeb's planner.
		UnlockTech = advUnmanned
	}

	// "Start safe rendezvous" in the same window: plans one maneuver at a time from the orbit actually reached,
	// so errors do not pile up. Steps: circularize (at the better apsis) -> match planes at the nearest node -> waiting
	// orbit above the target -> safe Hohmann transfer -> mid-course correction with RCS only (skipped without
	// RCS) -> match velocities at the offset distance of the window.
	RENDEZVOUS_AUTOPILOT
	{
		// The target's orbit must be at least this round.
		TargetMaxEccentricity = 0.01
		// Our orbit is circularized while more eccentric than this.
		RoundEccentricity = 0.01
		// From an eccentric orbit, or one in another plane, every route is estimated (dV and time until the velocities
		// are matched): circularize at apoapsis or at periapsis first; one burn at either node with the target's plane
		// (at either apsis when the planes are within PlaneAngle) that turns the plane and puts the opposite apsis at a
		// waiting orbit next to the target. The route with less dV is taken, unless it is more than SlowFactor times
		// slower than the fastest while the fastest costs at most DvMargin (share) more dV.
		SlowFactor = 2
		DvMargin = 0.10
		// Planes are matched while the relative inclination is above this, degrees.
		PlaneAngle = 5
		// Waiting orbit, when our orbit radius differs from the target's by less than PhasingMinDifference (share), or
		// when the braking after a transfer straight to the target would be too long (BrakeMaxOrbitShare).
		// Candidates: radius = target orbit radius x (1 + k x PhasingStep) above and / (1 + k x PhasingStep) below
		// (from the body's centre) up to PhasingRatio, plus the direct transfer from our own orbit. Each is timed
		// from the actual phase of the target (until the arrival); the cheapest one taking at most SlowFactor x as
		// long as the PhasingRatio orbit above is taken. Farther: the transfer window comes sooner but costs more dV.
		PhasingRatio = 1.25
		PhasingStep = 0.005
		PhasingMinDifference = 0.12
		// Only when there is no room above the target (sphere of influence): a waiting orbit below keeps
		// this many metres above the atmosphere or sea level.
		TerrainMargin = 10000
		// Mid-course correction: skipped for a flight shorter than CorrectionMinFlight seconds or a correction
		// below CorrectionMinDv m/s; done when the velocity error is below CorrectionTolerance m/s.
		CorrectionMinFlight = 300
		CorrectionMinDv = 0.05
		CorrectionTolerance = 0.02
		// The same step at most this many times in a row, then the autopilot stops.
		MaxAttempts = 3
		// The last braking is one steady burn, tail-first against the relative velocity (no maneuver node). Its
		// start is found by simulating the whole finite burn (thrust, mass flow, gravity, the target's orbit) at
		// BurnThrottle so that it ends the offset distance from the target, short of it. During the burn the rest is
		// re-simulated every BurnTrimInterval s from the actual state and only the throttle is trimmed within
		// BurnTrimMin..1. The engine stops at BurnCutSpeed m/s; RCS takes the rest down to CleanupTolerance m/s
		// (gives up after CleanupTimeout s; without RCS the autopilot ends there).
		// Sequence: on-rails warp until BrakeTurnLead seconds before the burn -> 1x, turn tail-first (turned =
		// within BrakeAlignedAngle degrees for 3 s) -> on-rails warp again until BrakeWarpStop seconds before the
		// burn -> the burn. Physics warp during the burn is left to the player, but switched off closer than
		// BrakeNoWarpDistance m. The engine fires only within BrakeAimAngle degrees of retrograde.
		BurnThrottle = 0.9
		BurnTrimMin = 0.5
		BurnTrimInterval = 2
		BurnCutSpeed = 1.0
		// A burn that would end farther than this (m) aside of the target is refused: the engine is too weak for
		// one retrograde burn (it lasts a sizeable part of an orbit and curves far off the approach line).
		BurnMaxLateral = 2000
		// Route planning: a transfer straight to the target is not used when its braking at BurnThrottle would last
		// more than this share of the target's orbital period; the route goes via a waiting orbit next to the target
		// instead (tests: 8.6 % ended 0.8 km aside, fine; 21 % would have ended 34 km aside).
		BrakeMaxOrbitShare = 0.12
		// A long circularization of a weak engine misses the waiting orbit (a 12-minute burn ended 30 km off, on the
		// target's side). A waiting orbit is at least WaitingMissMargin expected misses away from the target's orbit;
		// the miss is estimated from the burn time (a simulation of MechJeb's node executor).
		WaitingMissMargin = 3
		// The burn itself drifts sideways (a test ended ~230 m aside instead of 100). After each re-simulation, when
		// the burn would end more than NudgeMinMiss m off BurnLateralShare x the offset aside of the target and at
		// least NudgeMinTime s of burn are left, RCS gives NudgeGain of the sideways velocity that moves the end
		// point there, across the engine axis only, without turning the vessel.
		BurnLateralShare = 0.7
		NudgeMinMiss = 10
		NudgeMinTime = 30
		NudgeGain = 0.7
		NudgeMaxDv = 1.0
		// Physics warp: the global "Auto physics warp" choice (AUTO_PHYSICS_WARP below) for the turn tail-first and
		// for the braking burn farther than BrakeNoWarpDistance from the target.
		CleanupTolerance = 0.05
		CleanupTimeout = 180
		BrakeTurnLead = 150
		BrakeAlignedAngle = 3
		BrakeWarpStop = 5
		BrakeNoWarpDistance = 3000
		BrakeAimAngle = 10
	}

	// "Auto physics warp: off / x2 / x3 / x4" — one global choice, shown under MechJeb's own "Auto-warp" checkbox
	// (maneuver planner, node editor) and in the "Rendezvous with offset" window; remembered for all vessels in
	// PluginData/AutoPhysicsWarp.cfg. For every node MechJeb's node executor burns: the turn to the node in physics
	// warp while more than AimAngle degrees off (the last degrees at 1x so MechJeb can settle and warp on rails;
	// back into physics warp only beyond AimAngle + Hysteresis), the burn while more than
	// max(MinBurnDv m/s, TailSeconds x full acceleration) is left. MechJeb's own warp to the node is left alone.
	// Even with the choice off, physics warp switched on by the player is dropped for the last AimAngle degrees
	// of the turn (MechJeb warps to the node only once the vessel is settled, which physics warp prevents).
	AUTO_PHYSICS_WARP
	{
		// Until the player picks one in a window: 0 = off, 2, 3 or 4.
		DefaultRate = 4
		AimAngle = 5
		Hysteresis = 2
		MinBurnDv = 0.5
		TailSeconds = 0
	}

	// "Black box" window in MechJeb's window list: while switched on, writes to KSP.log a status
	// line of the active vessel (warp, SAS, RCS, thrust, running MechJeb modules, target) and events
	// (warp, vessel switches, SAS/RCS/target changes, staging, docking...). For debugging autopilots.
	// Lines start with "[MechJebTweaks] rec:"; near a loaded target vessel also "[MechJebTweaks] docking: d=".
	RECORDER
	{
		Enabled = true

		// Status line interval, real seconds.
		LogInterval = 1

		// Tech node(s) that unlock the window; empty = always (a debugging tool).
		UnlockTech =
	}

	// "RCS and reaction wheel check" window in MechJeb's window list, in the editor (the ship being built)
	// and in flight (the active vessel). Grades reaction wheels, RCS and RCS propellant with the docking
	// autopilot's own measures (turn time, RCS acceleration and approach speeds, DOCKING section below).
	CONTROL_CHECK
	{
		Enabled = true

		// Reaction wheels, 90 degree turn in pitch/yaw, s: up to TurnGood "excellent", up to TurnOk "fine",
		// up to DOCKING MaxTurnTime90 "slow", slower "too little". Missing torque is shown for TurnOk.
		TurnGood = 15
		TurnOk = 30

		// RCS acceleration in the weakest direction, m/s²: below RcsWeak "very weak", below RcsOk "weak",
		// above RcsStrong "strong". Missing thrust is shown for RcsOk.
		RcsWeak = 0.02
		RcsOk = 0.05
		RcsStrong = 0.5

		// RCS delta-v on the propellant aboard, m/s: below RcsDvLow "too little", below RcsDvTight "tight",
		// above RcsDvHigh "a lot" (dead weight).
		RcsDvLow = 10
		RcsDvTight = 20
		RcsDvHigh = 100
	}

	// "Docking" window in MechJeb's window list: start conditions, state of both vessels,
	// "point both vessels at each other" and the docking autopilot. Its events always go to KSP.log;
	// its per-second detail lines only while the flight recorder is on.
	DOCKING
	{
		Enabled = true

		// Tech node(s) that unlock the window in career/science. advUnmanned: stock probe cores first get
		// SAS level 3 there (target hold, which the autopilot needs); MechJeb opens its docking autopilot there too.
		UnlockTech = advUnmanned

		// The other vessel must be loaded and closer than this, m. Note: in orbit KSP only simulates
		// (unpacks) the other vessel within ~200 m; farther it is frozen and its SAS cannot turn it.
		MaxRange = 2500

		// Each vessel must turn 90 degrees with reaction wheels within this time, s.
		MaxTurnTime90 = 60

		// Aimed at each other below this pointing error, degrees.
		AlignedAngle = 0.5

		// Roughly aimed, degrees (only colours the status).
		RoughAngle = 10

		// Recommended approach speeds are computed from the RCS braking acceleration:
		// far approach speed = braking to touchdown speed fits into BrakeDistance,
		// touchdown speed = braking to zero fits into TouchStopDistance,
		// both with SafetyFactor (2 = assume half the RCS thrust), capped by the maxima, m/s and m.
		FarSpeedMax = 5
		TouchSpeedMax = 1
		BrakeDistance = 100
		TouchStopDistance = 10
		SafetyFactor = 2

		// Share of the summed RCS thrust assumed to be available for translation
		// (flight tests: real acceleration was 15-40% below the sum).
		RcsEfficiency = 0.8

		// Docking autopilot.
		// Starts at all only this close to the target (beyond ~2250 m KSP unloads it), m.
		FarStartMax = 2250
		// Closer than this it starts directly with the near approach (checkpoints), m.
		NearStartMax = 250
		// Far approach (RCS only): MechJeb's Lambert solver gives the velocity needed to meet the
		// target in distance / far speed seconds (not sooner than FarMinTime, s); RCS steers towards it
		// until the predicted closest approach (from the orbits, as in MechJeb's rendezvous info) is
		// within FarMissTolerance (m), or the velocity change still needed is below FarVelocityTolerance
		// (m/s) (at most FarCorrectionTimeout s). Then one coast in warp straight to the braking point
		// for 100 m, where the near approach takes over: on rails the closest approach does not change.
		FarMinTime = 60
		FarMissTolerance = 10
		FarVelocityTolerance = 0.02
		FarCorrectionTimeout = 240
		// Stop when closing faster than AbortSpeedFactor x leg speed + 0.3 m/s while coasting.
		AbortSpeedFactor = 2
		// A checkpoint correction is done when the closing speed is within
		// max(ClosingTolerance, ClosingToleranceShare x leg speed) and sideways speed within LateralTolerance, m/s.
		ClosingTolerance = 0.05
		ClosingToleranceShare = 0.05
		LateralTolerance = 0.05
		// Tighter sideways tolerance on the last leg (after 20 m, RCS off to the port), m/s,
		// and one more short sideways check at FinalCheckDistance, m.
		FinalLateralTolerance = 0.02
		FinalCheckDistance = 8
		// That last check is the strictest: sideways tolerance and controller deadband, m/s.
		FinalCheckLateralTolerance = 0.005
		FinalCheckDeadband = 0.002
		// Longest RCS correction at one checkpoint; then the autopilot goes on with what it has, s.
		CorrectionTimeout = 60
		// RCS controller: wanted acceleration = velocity error / RcsTimeConstant (s);
		// errors below Deadband (m/s) are ignored per axis. No integral term (no wind-up circling).
		RcsTimeConstant = 2
		Deadband = 0.005
		// Smallest non-zero command per axis (share of full RCS thrust): stock thrusters do nothing at or
		// below 5%, and with strong RCS the last cm/s of a correction asked for exactly that.
		MinRcsCommand = 0.1
		// The autopilot switches RCS on or off at most once per this many seconds (no flicker).
		RcsMinSwitch = 1
		// A correction starts RCS only once the nose points within this of the target, degrees:
		// with RCS on, SAS turns partly with RCS thrusters and those firings push the vessel sideways.
		AimBeforeRcs = 2
		// Final approach: brake again with RCS when faster than FinalOverspeed x touchdown speed.
		FinalOverspeed = 1.5
		// Stop if the vessels do not aim at each other at a checkpoint within this time, s.
		AlignTimeout = 180
		// Warp only when the coast to the next checkpoint is longer than this, s.
		MinWarpSeconds = 10
		// Final approach: stop after this long without closing in, s.
		FinalGrace = 30

		// Warp limit by the number of parts of all vessels within MaxRange (bystanders included).
		// Up to Warp50MaxParts: 50x, up to Warp10MaxParts: 10x, up to Warp5MaxParts: 5x, more: no warp.
		Warp50MaxParts = 150
		Warp10MaxParts = 400
		Warp5MaxParts = 800
	}
}
